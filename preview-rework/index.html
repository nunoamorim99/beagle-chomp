<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Beagle rework preview</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #eae6df; }
      canvas { display: block; }
      #hud {
        position: fixed; left: 12px; top: 12px; z-index: 10;
        font: 600 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace;
        color: #2a1a12; background: #ffffffcc; padding: 10px 12px;
        border-radius: 8px; box-shadow: 0 2px 10px #0002; white-space: pre;
      }
    </style>
  </head>
  <body>
    <div id="hud"></div>
    <script type="module">
      // Dev-only viewer for the img2threejs REWORK beagle (src/render/rework/).
      // Never a rollup input, so it never ships (same construction as /preview/).
      //
      //   ?az=<deg>      orbit azimuth (0 = front, 90 = character's right, 180 = rear, 270 = left)
      //   ?view=34|front|right|rear|left|top|face   named presets (az wins if both given)
      //   ?el=<deg>      elevation above the horizon (default 12; matched to the ref for 34)
      //   ?toon=1        swap every lit material for the game's cel-shaded toon() look
      //   ?grid=0 ?hud=0
      import * as THREE from "three";
      import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
      import { createBeaglePuppyToonCharacterModel } from "/src/render/rework/createBeagleModel.ts";
      import { createCartoonFleaModel } from "/src/render/rework/createFleaModel.ts";
      import { createCartoonMosquitoModel } from "/src/render/rework/createMosquitoModel.ts";
      import { makeEnemy, applyGhostState } from "/src/render/characters.ts";
      import { toon } from "/src/render/toon.ts";

      const q = new URLSearchParams(location.search);
      const VIEW_AZ = { front: 0, right: 90, rear: 180, back: 180, left: 270, "34": 42 };
      const view = q.get("view") ?? "34";
      const az = q.get("az") !== null ? Number(q.get("az")) : (VIEW_AZ[view] ?? 42);
      const el = q.get("el") !== null ? Number(q.get("el")) : (view === "top" ? 80 : 12);
      const showHud = q.get("hud") !== "0";

      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      // Game parity (scene.ts): NO tone mapping or the cel ramp bands re-compress.
      renderer.toneMapping = THREE.NoToneMapping;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xeae6df);

      const key = new THREE.DirectionalLight(0xfff4e2, 2.1);
      key.position.set(2.6, 4.2, 3.0);
      key.castShadow = true;
      key.shadow.mapSize.set(1024, 1024);
      key.shadow.camera.near = 0.5;
      key.shadow.camera.far = 14;
      const sc = key.shadow.camera;
      sc.left = -2.5; sc.right = 2.5; sc.top = 2.5; sc.bottom = -2.5;
      sc.updateProjectionMatrix();
      scene.add(key);
      scene.add(new THREE.HemisphereLight(0xdfeaff, 0xd8c6a8, 1.15));

      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(24, 24),
        new THREE.ShadowMaterial({ opacity: 0.22 }),
      );
      ground.rotation.x = -Math.PI / 2;
      ground.receiveShadow = true;
      scene.add(ground);

      const grid = new THREE.GridHelper(4, 40, 0xb9ad9b, 0xd2c9ba);
      grid.visible = q.get("grid") !== "0";
      scene.add(grid);

      // ?model=beagle|flea|crab|mosquito — one harness, one subject at a time. The rework
      // folder holds a generated factory per img2threejs run, and each needs the
      // same turntable/gate treatment, so the viewer switches rather than forking.
      // "flea-gen" is the img2threejs GENERATED factory; "flea" is the REAL
      // shipped builder. The review gates run against the real one on purpose —
      // the generated factory never ships, so measuring it would be measuring
      // the wrong mesh. ?color= sets the team colour the enemy is built with.
      const MODELS = {
        beagle: createBeaglePuppyToonCharacterModel,
        "flea-gen": createCartoonFleaModel,
        "mosquito-gen": createCartoonMosquitoModel,
        flea: () => makeEnemy("flea", Number(q.get("color") ?? 0xe8615f)),
        beetle: () => makeEnemy("beetle", Number(q.get("color") ?? 0xe8615f)),
        ladybug: () => makeEnemy("ladybug", Number(q.get("color") ?? 0xe8615f)),
        bee: () => makeEnemy("bee", Number(q.get("color") ?? 0xe8615f)),
        crab: () => makeEnemy("crab", Number(q.get("color") ?? 0xe8615f)),
        mosquito: () => makeEnemy("mosquito", Number(q.get("color") ?? 0xe8615f)),
        ghost: () => makeEnemy("ghost", Number(q.get("color") ?? 0xe8615f)),
      };
      const modelName = q.get("model") ?? "beagle";
      const makeModel = MODELS[modelName] ?? MODELS.beagle;
      const model = makeModel({ castShadow: true });
      scene.add(model);

      // ?state=frightened|eaten — the two recolours an enemy skin has to
      // survive. Worth a real render rather than a unit assertion: the question
      // is whether the model still READS as edible / as a pair of eyes, which
      // no assertion can answer.
      const state = q.get("state");
      if (state && model.userData?.bodyMat) {
        applyGhostState(model, state, { x: 0, y: 1 });
      }

      // ?flat=1 — map-stripped clay render for the blockout gate. Every material
      // becomes one neutral grey so the FORM is judged with nothing to flatter
      // it: no team colour, no dark/light contrast between body and limbs, no
      // catchlight. A silhouette that only works because the legs are dark
      // fails here, which is the point.
      if (q.get("flat") === "1") {
        const clay = new THREE.MeshLambertMaterial({ color: 0xb9b2a8 });
        model.traverse((o) => {
          if (o.isMesh) o.material = clay;
        });
      }

      // ?toon=1 — judge the model in the GAME's material system: every lit
      // surface swapped to the shared 3-step cel ramp, keeping each mesh's color.
      if (q.get("toon") === "1") {
        model.traverse((o) => {
          if (!o.isMesh) return;
          const m = o.material;
          if (!m || m.userData?.keepUnlit) return;
          const c = m.color ? m.color.clone() : new THREE.Color(0xffffff);
          const t = toon({ color: c.getHex() });
          if (m.vertexColors) t.vertexColors = true;
          o.material = t;
        });
      }

      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const centre = box.getCenter(new THREE.Vector3());
      // ?fov= is the REVIEW instrument, not a preference. The reference images this
      // pipeline compares against are product-style renders shot on a long lens, so
      // a Tier 1 capture taken at the viewer's default 32deg fills the frame only by
      // standing very close — and the near-camera limbs then inflate. Measured on the
      // crab: a near-orthographic front silhouette is 1.403 wide:tall while the same
      // model at 32deg filling the frame measures 1.126, against a reference of 1.231.
      // A narrow fov plus a matched distance gives correct framing AND mild perspective.
      const fov = q.get("fov") !== null ? Number(q.get("fov")) : 32;
      const camera = new THREE.PerspectiveCamera(fov, innerWidth / innerHeight, 0.1, 100);
      const target = new THREE.Vector3(0, centre.y, 0);
      let dist = Math.max(size.x, size.y, size.z) * (q.get("dist") !== null ? Number(q.get("dist")) : 3.2);
      if (view === "face") {
        target.set(0, centre.y + size.y * 0.28, size.z * 0.2);
        dist *= 0.45;
      }
      const azr = (az * Math.PI) / 180;
      const elr = (el * Math.PI) / 180;
      // az 0 looks at the character's FRONT (+Z faces camera); az 90 orbits to
      // the character's right (-X side of the world... character right = -X).
      const dir = new THREE.Vector3(
        -Math.sin(azr) * Math.cos(elr),
        Math.sin(elr),
        Math.cos(azr) * Math.cos(elr),
      );
      camera.position.copy(target).addScaledVector(dir, dist);
      camera.lookAt(target);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(target);
      controls.enableDamping = true;
      controls.update();

      addEventListener("resize", () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      const hud = document.getElementById("hud");
      let tris = 0, meshes = 0;
      model.traverse((o) => {
        if (!o.isMesh) return;
        meshes++;
        const g = o.geometry;
        tris += g.index ? g.index.count / 3 : g.attributes.position.count / 3;
      });
      hud.textContent =
        `${modelName}  az ${az} el ${el}${q.get("toon") === "1" ? " toon" : ""}\n` +
        `size    ${size.x.toFixed(2)} w x ${size.y.toFixed(2)} h x ${size.z.toFixed(2)} l\n` +
        `floor   ${box.min.y.toFixed(3)}\n` +
        `meshes  ${meshes}\n` +
        `tris    ${Math.round(tris)}`;
      if (!showHud) hud.style.display = "none";

      window.__preview = { THREE, scene, camera, model, renderer };

      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });
      renderer.render(scene, camera);
      document.title = "Beagle rework preview — ready";
    </script>
  </body>
</html>
