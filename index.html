<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- The design system's outline colour: the browser/OS chrome around an
         installed PWA should be the same ink line that frames everything
         inside it. -->
    <meta name="theme-color" content="#1B1512" />
    <!-- The standard name first; Chrome deprecated the apple-prefixed one and
         warns about it in the console. The apple- version stays because older
         iOS Safari still only understands that spelling, and it is what makes
         an installed Beagle Chomp open without browser chrome on iPhone. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Relative paths, matching vite's base: "./". Originally for the GitHub
         Pages subpath; since v5.0 the site is served from the root of
         beaglechomp.nunoamorim.dev, where relative paths work just as well. -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./favicon-180.png" />

    <!-- Design system §02 Typography + §03 Icons: Baloo 2 (display),
         Quicksand (body), DM Mono (numeric) and Material Symbols Rounded.

         THERE ARE DELIBERATELY NO FONT <link>s HERE. The faces are subset and
         self-hosted, declared in src/ui/tokens.css and pulled in through the
         stylesheet the app already loads — see that file's header for why
         (short version: this is an offline-capable PWA, and a blocked CDN
         request made every icon render its own ligature name, so buttons read
         "arrow_back Menu"). Do not reintroduce a Google Fonts link. -->

    <title>Beagle Chomp</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <!-- Every HUD readout is a SCRIM CHIP (design system §07): 86% ink, 3px
         outline, and an icon PLATE for the thing being counted. It replaces a
         text-shadow halo, which was the previous answer to "this sits on a
         bright sky half the time and on dark soil the other half" — a halo is
         a compromise that is slightly wrong on both, while solid ink is simply
         readable on either. §08 walks through that comparison.

         The plates matter as much as the chips: a biscuit and a coin are
         things you collect in the maze two inches away, so drawing them as
         lit objects rather than as glyphs in a text run makes the score and
         the wallet self-labelling. -->
    <div class="hud">
      <div class="hud-left">
        <div class="hud-chip stat">
          <span class="bc-plate bc-plate--biscuit bc-plate--hud" aria-hidden="true"><i class="bc-i">cookie</i></span>
          <div><div class="k">Score</div><div class="v" id="score">0</div></div>
        </div>
        <!-- IDEA-016/IDEA-017 coin wallet. The plate IS the label now — a coin
             is a thing the player picks up in the maze, so a word beside it was
             saying the same thing twice in a corner with no room to spare. The
             screen reader still gets one. -->
        <div class="hud-chip stat coin-stat">
          <span class="bc-plate bc-plate--coin bc-plate--hud" aria-hidden="true"><i class="bc-i">paid</i></span>
          <span class="sr-only">Coins</span><span class="v" id="coins">0</span>
        </div>
      </div>

      <!-- The right COLUMN: map + lives on top, chrome underneath. The chrome
           row used to be a separate fixed element parked at an absolute offset,
           because .hud was a three-way space-between that a fourth child would
           re-balance. The redesign makes .hud two columns instead, so the
           buttons can simply live in the one they belong to and stay aligned
           with the chips above them at any safe-area inset. -->
      <div class="hud-right">
        <div class="hud-row">
          <!-- setLevel splits "Map 3" into the MAP eyebrow and the figure, and
               shows "Bonus"/"C5" whole (see hud.ts) — so the chip never reads
               "MAP Bonus". -->
          <div class="hud-chip hud-chip--tight" id="levelChip">
            <span class="k" id="levelLabel">Map</span><span class="v" id="level">1</span>
          </div>
          <!-- Hearts are written by hud.ts’s setLives (one per life, spent ones
               dimmed rather than removed so the chip never resizes mid-run). -->
          <div class="hud-chip hud-chip--tight lives" id="lives" role="img" aria-label="Lives"></div>
        </div>
        <div class="hud-buttons">
          <!-- 44px squircles: big enough for a thumb mid-chase, small enough
               that three of them sit under the map/lives row without widening
               the column past it. -->
          <button type="button" class="mute-btn" id="muteBtn" aria-label="Mute sound" aria-pressed="false"><i class="bc-i" aria-hidden="true">volume_up</i></button>
          <!-- Pause. Replaced the old mid-run shop button: since IDEA-036 the
               shop has its own place on the menu, so a shop shortcut here was
               redundant — whereas the game had no way to pause at all. -->
          <button type="button" class="pause-btn" id="pauseBtn" aria-label="Pause game"><i class="bc-i" aria-hidden="true">pause</i></button>
          <!-- IDEA-021: abandons the run in progress and returns to the menu. -->
          <button type="button" class="home-btn" id="homeBtn" aria-label="Back to menu"><i class="bc-i" aria-hidden="true">home</i></button>
        </div>
      </div>
    </div>

    <!-- IDEA-046: the active power-up tray. Nuno: "on the UI we should have a
         space where the active power-ups appear, to let the user know which
         power-ups they have."
         Deliberately OUTSIDE .hud, like .hud-buttons: .hud is a space-between
         row of three and a fourth child would silently re-balance it. Sits
         under the Score/Coins column on the left, where the eye already goes
         for run state, and is EMPTY (and therefore invisible) until something
         is held, so it costs no screen space in the common case. -->
    <div class="powerups" id="powerups" aria-live="polite" aria-label="Active power-ups"></div>


    <div class="center hidden" id="center"></div>

    <!-- IDEA-021 v2: the full-screen main menu overlay. Transparent to the 3D
         menu scene rendered behind it (src/render/menuScene.ts) except its own
         text/buttons — the menu screen IS the 3D scene, with this UI floating
         over it. Shown/hidden by src/game/game.ts's showMenu(). -->
    <div class="hidden" id="mainMenu">
      <!-- A thin top bar: wallet on the left, sound on the right. The wallet
           moved up here from under the title, so the title block is nothing
           but the game's name, and the coin count sits where a player already
           looks for a currency. -->
      <div class="menu-bar">
        <p class="coin-line" id="menuCoinLine" role="img" aria-label="Coins">
          <span class="bc-plate bc-plate--coin" aria-hidden="true"><i class="bc-i">paid</i></span>
          <span id="menuCoinCount">0</span>
        </p>
        <!-- The menu's own mute control. attachMuteButton wires EVERY
             .mute-btn on the page and keeps them in sync, so this and the
             in-run one are one switch with two placements. -->
        <button type="button" class="mute-btn" id="menuMuteBtn" aria-label="Mute sound" aria-pressed="false"><i class="bc-i" aria-hidden="true">volume_up</i></button>
      </div>

      <!-- IDEA-036: the "three.js · maze chase" eyebrow was removed — a v2.0
           framing device that had outlived its purpose.
           Two lines, so the name can be set big enough to carry a 6px ink
           stroke and still leave the middle of the frame to the beagle. -->
      <div class="menu-top">
        <!-- The space before the <br> is load-bearing, not a typo: a <br>
             contributes NO whitespace to textContent, so "Beagle<br>Chomp" has
             the accessible name "BeagleChomp" and is announced as one word.
             The space fixes the name and collapses to nothing visually, since
             it falls at the end of a line. -->
        <h1>Beagle <br />Chomp</h1>
      </div>

      <!-- The destination row REPLACES the swipe carousel (IDEA-036 v3).
           Four tiles fit a 390px screen without scrolling, so the rail, its
           arrows and its edge-fade mask are all gone — the rail only ever
           existed because five items did not fit, and Play is no longer one
           of them. Play is its own full-width block above them: it is the one
           thing most players press, and it should not be a card among cards. -->
      <div class="menu-bottom">
        <button type="button" id="playBtn" class="menu-play">
          <span class="bc-i" aria-hidden="true">play_arrow</span>Play
        </button>
        <div class="menu-tiles">
          <!-- IDEA-013 Challenge Mode: 8 fixed levels with per-level
               speed/extra-ghost/short-fright twists. -->
          <button type="button" id="challengeBtn" class="menu-tile menu-tile--challenge">
            <span class="menu-tile-icon bc-i" aria-hidden="true">trophy</span>
            <span class="menu-tile-label">Challenge</span>
          </button>
          <button type="button" id="menuShopBtn" class="menu-tile menu-tile--shop">
            <span class="menu-tile-icon bc-i" aria-hidden="true">storefront</span>
            <span class="menu-tile-label">Shop</span>
          </button>
          <!-- IDEA-020: the shared scoreboard (classic mode only). "Board"
               rather than "Leaderboard": the word has to fit a quarter of a
               390px screen without dropping below the display font's 12px
               floor, and the icon already says which board it is. -->
          <button type="button" id="menuLeaderboardBtn" class="menu-tile menu-tile--board">
            <span class="menu-tile-icon bc-i" aria-hidden="true">leaderboard</span>
            <span class="menu-tile-label">Board</span>
          </button>
          <!-- IDEA-019: account screen (stats, sign out, delete account).
               Both are wired in main.ts rather than game.ts — the game
               layer has no concept of accounts, and keeping it that way
               means the auth work never reaches into the game loop. -->
          <button type="button" id="menuProfileBtn" class="menu-tile menu-tile--account">
            <span class="menu-tile-icon bc-i" aria-hidden="true">person</span>
            <span class="menu-tile-label">Account</span>
          </button>
        </div>
      </div>
    </div>

    <!-- IDEA-023 shop v2: a full-screen dedicated PAGE (not an overlay panel)
         — deliberately a SEPARATE container from #center/#mainMenu, so
         opening the shop mid-play or over the Start/main-menu screen never
         clobbers either (game.ts's tick() freezes gameplay underneath while
         this is open). Entirely (re)rendered by src/ui/shop.ts; the live 3D
         hero preview shows through from the canvas behind (src/render/
         shopScene.ts), same "transparent overlay over the 3D scene" pattern
         as #mainMenu. -->
    <div class="hidden" id="shop"></div>

    <!-- IDEA-014: the Challenge "garden path" level-select PAGE — same
         "full-screen dedicated page, deliberately separate from #center/
         #mainMenu" pattern as #shop above, entirely (re)rendered by
         src/ui/levelMap.ts. Opened by #challengeBtn (replacing the old
         auto-continue-at-progress behavior) and closes back to #mainMenu. -->
    <div class="hidden" id="levelMap"></div>

    <!-- IDEA-019 accounts. Same "full-screen dedicated page, entirely rendered
         by its own src/ui/* module" pattern as #shop and #levelMap above.

         #authGate is the app's FRONT DOOR: sign-in is required before play (no
         guest mode), so main.ts shows it before the Game is even constructed
         and awaits it. It has no back-out by design.

         #recoveryCode is deliberately blocking — no backdrop dismiss, no
         Escape, an explicit confirm — because with no email on file the code it
         shows is the ONLY way back into an account. -->
    <div class="hidden" id="authGate"></div>
    <div class="hidden" id="recoveryCode"></div>
    <div class="hidden" id="profile"></div>
    <div class="hidden" id="privacy"></div>

    <!-- IDEA-020: the shared scoreboard. CLASSIC MODE ONLY — challenge runs are
         deliberately unranked (their modifiers make scores incomparable). Rows
         are built with createElement/textContent by src/ui/leaderboard.ts, not
         innerHTML: this is the one screen that renders strings authored by
         OTHER players, so injection is structurally impossible rather than
         escaped-and-hopefully-correct. -->
    <div class="hidden" id="leaderboard"></div>

    <!-- IDEA-040 tutorial v2: the how-to-play carousel. Same "full-screen page
         rendered entirely by its own src/ui module" pattern as #shop and
         #leaderboard. Deliberately transparent above the card so the live 3D
         illustration (rendered behind by game.ts, via shopScene) shows
         through. Opened before the first run, and any time from Account. -->
    <div class="hidden" id="tutorial"></div>

    <!-- Shown while the boot flow checks a stored token, and if the API can't
         be reached (the game is online-only by design). -->
    <div class="hidden" id="boot"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
