<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0b16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Relative paths so they resolve under the GitHub Pages subpath (matches vite base: "./"). -->
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./favicon-180.png" />
    <title>Beagle Chomp</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div class="hud">
      <div class="hud-left">
        <div class="stat"><div class="k">Score</div><div class="v" id="score">0</div></div>
        <!-- IDEA-016/IDEA-017 coin wallet display: a compact pill under Score
             so the Score/Map/Lives row keeps its original 3-way balance. -->
        <div class="coin-stat"><span class="coin-icon" aria-hidden="true">🪙</span><span class="k">Coins</span><span class="v" id="coins">0</span></div>
      </div>
      <div class="stat" style="text-align:center"><div class="k">Map</div><div class="v" id="level">1</div></div>
      <div class="stat" style="text-align:right"><div class="k">Lives</div><div class="lives v" id="lives">🐶🐶🐶</div></div>
    </div>

    <!-- IDEA-036 v2: mute / shop / home, laid out as a HORIZONTAL row rather
         than the old vertical stack down the right edge. The stack cost ~120px
         of height and pushed the maze down — noticeable on a phone, and worse
         with the D-pad (IDEA-038) taking the bottom of the screen.
         Deliberately OUTSIDE .hud so its own flex layout can't disturb the
         Score/Map/Lives space-between row. -->
    <div class="hud-buttons">
      <button type="button" class="mute-btn" id="muteBtn" aria-label="Mute sound" aria-pressed="false">🔊</button>
      <!-- IDEA-012 shop: opens the skin-picker/storefront overlay (#shop below). -->
      <button type="button" class="shop-btn" id="shopBtn" aria-label="Open shop">🛒</button>
      <!-- IDEA-021: abandons the run in progress and returns to the main menu. -->
      <button type="button" class="home-btn" id="homeBtn" aria-label="Back to menu">🏠</button>
    </div>

    <div class="center hidden" id="center"></div>

    <!-- IDEA-021 v2: the full-screen main menu overlay. Transparent to the 3D
         menu scene rendered behind it (src/render/menuScene.ts) except its own
         text/buttons — the menu screen IS the 3D scene, with this UI floating
         over it. Shown/hidden by src/game/game.ts's showMenu(). -->
    <div class="hidden" id="mainMenu">
      <!-- IDEA-036: the "three.js · maze chase" eyebrow was removed — a v2.0
           framing device that had outlived its purpose. -->
      <div class="menu-top">
        <h1>Beagle Chomp</h1>
        <p class="coin-line" id="menuCoinLine">&#x1FA99; 0 coins</p>
      </div>
      <div class="menu-bottom">
        <!-- IDEA-036: Play stays a standalone primary action; the four
             secondary destinations became a CARROUSEL. At five stacked
             buttons the row was crowding the 3D showcase, and the beagle
             should stay the hero of this screen. -->
        <button type="button" id="playBtn" class="menu-play">&#9654; Play</button>

        <div class="menu-carousel">
          <button type="button" class="carousel-arrow" id="carouselPrev"
                  aria-label="Previous option">&#8249;</button>

          <div class="carousel-viewport">
            <div class="carousel-track" id="carouselTrack">
              <!-- IDEA-013 Challenge Mode: 8 fixed levels with per-level
                   speed/extra-ghost/short-fright twists. -->
              <button type="button" id="challengeBtn" class="carousel-item">
                <span class="carousel-icon" aria-hidden="true">&#127942;</span>
                <span class="carousel-label">Challenge</span>
              </button>
              <button type="button" id="menuShopBtn" class="carousel-item">
                <span class="carousel-icon" aria-hidden="true">&#128722;</span>
                <span class="carousel-label">Shop</span>
              </button>
              <!-- IDEA-020: the shared scoreboard (classic mode only). -->
              <button type="button" id="menuLeaderboardBtn" class="carousel-item">
                <span class="carousel-icon" aria-hidden="true">&#128202;</span>
                <span class="carousel-label">Leaderboard</span>
              </button>
              <!-- IDEA-019: account screen (stats, sign out, delete account).
                   Both are wired in main.ts rather than game.ts — the game
                   layer has no concept of accounts, and keeping it that way
                   means the auth work never reaches into the game loop. -->
              <button type="button" id="menuProfileBtn" class="carousel-item">
                <span class="carousel-icon" aria-hidden="true">&#128100;</span>
                <span class="carousel-label">Account</span>
              </button>
            </div>
          </div>

          <button type="button" class="carousel-arrow" id="carouselNext"
                  aria-label="Next option">&#8250;</button>
        </div>
      </div>
    </div>

    <!-- IDEA-023 shop v2: a full-screen dedicated PAGE (not an overlay panel)
         — deliberately a SEPARATE container from #center/#mainMenu, so
         opening the shop mid-play or over the Start/main-menu screen never
         clobbers either (game.ts's tick() freezes gameplay underneath while
         this is open). Entirely (re)rendered by src/ui/shop.ts; the live 3D
         hero preview shows through from the canvas behind (src/render/
         shopScene.ts), same "transparent overlay over the 3D scene" pattern
         as #mainMenu. -->
    <div class="hidden" id="shop"></div>

    <!-- IDEA-014: the Challenge "garden path" level-select PAGE — same
         "full-screen dedicated page, deliberately separate from #center/
         #mainMenu" pattern as #shop above, entirely (re)rendered by
         src/ui/levelMap.ts. Opened by #challengeBtn (replacing the old
         auto-continue-at-progress behavior) and closes back to #mainMenu. -->
    <div class="hidden" id="levelMap"></div>

    <!-- IDEA-019 accounts. Same "full-screen dedicated page, entirely rendered
         by its own src/ui/* module" pattern as #shop and #levelMap above.

         #authGate is the app's FRONT DOOR: sign-in is required before play (no
         guest mode), so main.ts shows it before the Game is even constructed
         and awaits it. It has no back-out by design.

         #recoveryCode is deliberately blocking — no backdrop dismiss, no
         Escape, an explicit confirm — because with no email on file the code it
         shows is the ONLY way back into an account. -->
    <div class="hidden" id="authGate"></div>
    <div class="hidden" id="recoveryCode"></div>
    <div class="hidden" id="profile"></div>
    <div class="hidden" id="privacy"></div>

    <!-- IDEA-020: the shared scoreboard. CLASSIC MODE ONLY — challenge runs are
         deliberately unranked (their modifiers make scores incomparable). Rows
         are built with createElement/textContent by src/ui/leaderboard.ts, not
         innerHTML: this is the one screen that renders strings authored by
         OTHER players, so injection is structurally impossible rather than
         escaped-and-hopefully-correct. -->
    <div class="hidden" id="leaderboard"></div>

    <!-- Shown while the boot flow checks a stored token, and if the API can't
         be reached (the game is online-only by design). -->
    <div class="hidden" id="boot"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
