# Local development stack (STACK.md §1: "Docker Compose — frontend + backend +
# Postgres, with hot reload").
#
#     docker compose up -d        # db + api + the frontend, all three
#
# Then http://localhost:5173 for the game and http://localhost:5173/editor/ for
# the character editor. There is no second command and no second port: the
# editor is just a route on the same dev server, which is what removes the
# "why are there two of these running" problem entirely.
#
# WHY THE FRONTEND IS IN HERE NOW. It used to sit behind a `full` profile with
# the host running `npm run dev`, because bind-mounting node_modules on Windows
# is slow. That trade was reconsidered after two orphaned host dev servers (one
# ten days old, one three) were found squatting 5173 and 5175 — a process you
# start by hand is a process you forget to stop, and `docker compose ps` shows
# you the truth in a way a stray terminal never will. The slowness is dealt with
# below rather than avoided: node_modules lives in a NAMED volume (never the
# host's, which would also mix Windows and Linux native binaries), and install
# only re-runs when the lockfile actually changes.
#
# EDITING vite.config.ts NEEDS A MANUAL RESTART:
#     docker compose restart web
# Vite watches its own config and restarts itself in place, but that restart
# races strictPort — the new server tries to bind 5173 before the old one has
# let go, fails, and leaves a process that is alive but serving nothing. The
# healthcheck below now surfaces that as `unhealthy` instead of `Up`, but the
# restart is still the fix. Nothing else in the repo needs it; ordinary source
# edits hot-reload fine.
#
# The host path still works and is still faster for a tight edit loop:
#     npm run dev
# Stop the container first, or the port is taken — vite.config.ts uses
# strictPort, so it will say so rather than quietly starting a second copy.
#
# TESTS STILL RUN ON THE HOST. `npm run test`, `tsc` and the Playwright editor
# suites spin up their own Vite via createServer() and do not touch this stack,
# so `npm install` on the host is still needed for those.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: beaglechomp
      POSTGRES_USER: beaglechomp
      POSTGRES_PASSWORD: devpassword
    ports:
      # 5433 on the host so this never collides with a locally installed
      # Postgres on the default 5432.
      - "5433:5432"
    volumes:
      - beaglechomp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beaglechomp -d beaglechomp"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      # Context is the repo ROOT (not server/) — matches the Dokploy config, and
      # later increments COPY src/game/* for the shared game constants.
      context: .
      dockerfile: server/Dockerfile
      target: dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      # `db` is the compose service name; inside the network it's port 5432.
      DATABASE_URL: postgres://beaglechomp:devpassword@db:5432/beaglechomp
      # localhost:5173 is added automatically outside production (see env.ts),
      # but listing it here keeps the intent visible.
      CORS_ORIGINS: http://localhost:5173
      TOKEN_TTL_DAYS: 90
      LOG_LEVEL: debug
    ports:
      # Host 3001 → container 3000. 3000 is taken on this machine by another
      # project (tln-backend), and picking a free host port is friendlier than
      # fighting over it. The container still listens on 3000 internally, so
      # production/Dokploy is unaffected — only the host-side mapping differs.
      # The frontend's VITE_API_URL must therefore be http://localhost:3001.
      - "3001:3000"
    volumes:
      # Hot reload: tsx watch picks up host edits. node_modules stays in the
      # image (anonymous volume) so the host's OS/arch can't leak in.
      - ./server/src:/app/src
      - ./server/scripts:/app/scripts
      - ./server/migrations:/app/migrations
      - /app/node_modules
    mem_limit: 384m   # STACK.md §3.2 — one service can't starve Postgres

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: unless-stopped
    # Install only when the lockfile has actually changed.
    #
    # The old command ran `npm ci` on every single start, which meant a full
    # reinstall every time the stack came up — the main reason this service was
    # unpleasant enough to keep behind a profile. The stamp file lives inside
    # the node_modules volume, so it survives restarts along with the install
    # it describes, and `-nt` re-runs the install the moment package-lock.json
    # is newer than it.
    command: >
      sh -c '
        if [ ! -f node_modules/.installed ] || [ package-lock.json -nt node_modules/.installed ]; then
          echo "[web] lockfile changed (or first run) — installing dependencies…";
          npm ci && touch node_modules/.installed;
        else
          echo "[web] dependencies up to date";
        fi
        exec npm run dev
      '
    environment:
      # Read by the BROWSER, which runs on the host — so this is the host-side
      # mapping (3001), NOT the api service name. Pointing it at http://api:3000
      # is the classic mistake here and fails for everyone except the container.
      VITE_API_URL: http://localhost:3001
      # Turns on watcher polling in vite.config.ts. Only set here: file events
      # do not cross a Windows bind mount, so without it HMR silently never
      # fires; on the host, native events work and polling would just burn CPU.
      DOCKER_DEV: "1"
    ports:
      - "5173:5173"
    # Without this the container reports "Up" whenever the node process is
    # alive, which is not the same thing as the dev server answering — and the
    # difference cost real time once already: a failed config hot-restart left a
    # zombie that served nothing while `docker compose ps` said Up.
    #
    # `node -e` rather than curl: curl is not in node:22-bookworm-slim, and
    # node 22 has global fetch, so this needs nothing installed.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      # Generous: the very first start installs dependencies before Vite boots.
      start_period: 90s
    volumes:
      - ./:/app
      # A NAMED volume, not the anonymous one this used to have. Anonymous
      # volumes are discarded when the container is recreated, so every
      # `compose up --force-recreate` threw the install away. It must also stay
      # separate from the host's node_modules either way: esbuild and rollup
      # ship platform-specific binaries, and mixing Windows and Linux ones
      # breaks both.
      - beaglechomp_web_modules:/app/node_modules
    mem_limit: 1g

volumes:
  beaglechomp_pgdata:
  beaglechomp_web_modules:
